apiVersion: apps/v1
kind: Deployment
metadata:
  name: canteen-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canteen-service
  template:
    metadata:
      labels:
        app: canteen-service
    spec:
      containers:
      - name: canteen-service
        image: mealmontor-canteen-service:latest
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: docker
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/mealmontor_canteen
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          value: password
---
apiVersion: v1
kind: Service
metadata:
  name: canteen-service
spec:
  selector:
    app: canteen-service
  ports:
  - protocol: TCP
    port: 8083
    targetPort: 8083
  type: ClusterIP
