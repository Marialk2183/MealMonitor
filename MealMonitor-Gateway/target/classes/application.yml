server:
  port: 8080

spring:
  application:
    name: MealMonitor-Gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://MealMonitor-UserService
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: lb://MealMonitor-AuthService
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: review-service
          uri: lb://MealMonitor-ReviewService
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=1
        - id: canteen-service
          uri: lb://MealMonitor-CanteenService
          predicates:
            - Path=/api/canteen/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: lb://MealMonitor-NotificationService
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        - id: moderation-service
          uri: lb://MealMonitor-ModerationService
          predicates:
            - Path=/api/moderation/**
          filters:
            - StripPrefix=1
        - id: static-content
          uri: lb://MealMonitor-WebApp
          predicates:
            - Path=/**, /index.html, /dashboard.html
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
