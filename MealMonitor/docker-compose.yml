version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mealmontor-postgres
    environment:
      POSTGRES_DB: mealmontor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mealmontor-network

  mongodb:
    image: mongo:6
    container_name: mealmontor-mongodb
    environment:
      MONGO_INITDB_DATABASE: mealmontor
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mealmontor-network

  app:
    build: .
    container_name: mealmontor-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mealmontor
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/mealmontor
    networks:
      - mealmontor-network

volumes:
  postgres_data:
  mongodb_data:

networks:
  mealmontor-network:
    driver: bridge
