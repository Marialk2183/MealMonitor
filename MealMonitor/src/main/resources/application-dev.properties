# Development Profile Configuration
spring.application.name=MealMonitor-Dev

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Development
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MongoDB Configuration (H2 for development)
spring.data.mongodb.uri=mongodb://localhost:27017/mealmontor-dev

# JWT Configuration
jwt.secret=DevSecretKeyForJWTTokenGenerationAndValidationInDevelopmentMode
jwt.expiration=86400000

# Email Configuration (disabled for development)
spring.mail.enabled=false

# Eureka Configuration (disabled for development)
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Logging
logging.level.com.MealMonitor=DEBUG
logging.level.org.springframework.security=DEBUG
