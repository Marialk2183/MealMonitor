# Test Configuration
spring.application.name=MealMonitor-Test

# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# MongoDB Configuration for Tests
spring.data.mongodb.uri=mongodb://localhost:27017/mealmontor-test

# JWT Configuration for Tests
jwt.secret=TestSecretKeyForJWTTokenGenerationAndValidation
jwt.expiration=3600000

# Disable Eureka for tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
