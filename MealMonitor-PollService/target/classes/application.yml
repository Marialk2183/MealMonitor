server:
  port: 8087

spring:
  application:
    name: MealMonitor-PollService
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:polls}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true


