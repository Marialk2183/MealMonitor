version: '3.8'

services:
  # Eureka Server
  eureka-server:
    build: ./MealMonitor-EurekaServer
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - mealmontor-network

  # API Gateway
  api-gateway:
    build: ./MealMonitor-Gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - eureka-server
    networks:
      - mealmontor-network

  # User Service
  user-service:
    build: ./MealMonitor-UserService
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-users:5432/mealmontor_users
    depends_on:
      - postgres-users
      - eureka-server
    networks:
      - mealmontor-network

  # Review Service
  review-service:
    build: ./MealMonitor-ReviewService
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb-reviews:27017/mealmontor_reviews
    depends_on:
      - mongodb-reviews
      - eureka-server
    networks:
      - mealmontor-network

  # Canteen Service
  canteen-service:
    build: ./MealMonitor-CanteenService
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-canteen:5432/mealmontor_canteen
    depends_on:
      - postgres-canteen
      - eureka-server
    networks:
      - mealmontor-network

  # Notification Service
  notification-service:
    build: ./MealMonitor-NotificationService
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-notifications:5432/mealmontor_notifications
    depends_on:
      - postgres-notifications
      - eureka-server
    networks:
      - mealmontor-network

  # Web Application
  web-app:
    build: ./MealMonitor-WebApp
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - eureka-server
    networks:
      - mealmontor-network

  # PostgreSQL for Users
  postgres-users:
    image: postgres:15
    environment:
      POSTGRES_DB: mealmontor_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    networks:
      - mealmontor-network

  # PostgreSQL for Canteen
  postgres-canteen:
    image: postgres:15
    environment:
      POSTGRES_DB: mealmontor_canteen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_canteen_data:/var/lib/postgresql/data
    networks:
      - mealmontor-network

  # PostgreSQL for Notifications
  postgres-notifications:
    image: postgres:15
    environment:
      POSTGRES_DB: mealmontor_notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    networks:
      - mealmontor-network

  # MongoDB for Reviews
  mongodb-reviews:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: mealmontor_reviews
    ports:
      - "27017:27017"
    volumes:
      - mongodb_reviews_data:/data/db
    networks:
      - mealmontor-network

  # Redis for Caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mealmontor-network

volumes:
  postgres_users_data:
  postgres_canteen_data:
  postgres_notifications_data:
  mongodb_reviews_data:

networks:
  mealmontor-network:
    driver: bridge
