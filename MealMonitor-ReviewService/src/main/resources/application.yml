server:
  port: 8082

spring:
  application:
    name: MealMonitor-ReviewService
  data:
    mongodb:
      uri: mongodb://localhost:27017/mealmontor_reviews
  profiles:
    active: dev

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
